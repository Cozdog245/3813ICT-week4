<div class="container mt-4" style="max-width: 400px;">
  <h2>Profile</h2>
  <form>
    <div class="mb-3">
      <label class="form-label">Username</label>
      <input type="text" class="form-control" [(ngModel)]="user.username" name="username">
    </div>
    <div class="mb-3">
      <label class="form-label">Birthdate</label>
      <input type="text" class="form-control" [(ngModel)]="user.birthdate" name="birthdate">
    </div>
    <div class="mb-3">
      <label class="form-label">Age</label>
      <input type="number" class="form-control" [(ngModel)]="user.age" name="age">
    </div>
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="text" class="form-control" [(ngModel)]="user.email" name="email">
    </div>
    <button type="button" class="btn btn-primary" (click)="save()">Save</button>
  </form>
</div>
